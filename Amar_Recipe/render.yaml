# render.yaml
# Render Blueprint for Amar Recipe Backend

services:
  - type: web
    name: amar-recipe-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
    healthCheckPath: /src/api/get_recipes.php
