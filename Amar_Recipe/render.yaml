# render.yaml
# Render Blueprint for Amar Recipe Backend with PostgreSQL

services:
  - type: web
    name: amar-recipe-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: RENDER
        value: "true"
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: amar-recipe-db
          property: connectionURI
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: "sharifislam0505@gmail.com"
    # Database will be created separately and linked

databases:
  - name: amar-recipe-db
    databaseName: amar_recipe
    plan: free
