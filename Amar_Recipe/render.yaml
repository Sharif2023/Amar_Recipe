# render.yaml
# Render Blueprint for Amar Recipe Backend with PostgreSQL

services:
  - type: web
    name: amar-recipe-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: RENDER
        value: "true"
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: amar-recipe-db
          property: connectionURI
    # Database will be created separately and linked

databases:
  - name: amar-recipe-db
    databaseName: amar_recipe
    plan: free
